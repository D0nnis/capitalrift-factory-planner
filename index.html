<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capital Rift — Factory Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141414; --panel:#1e1e1e; --panel2:#242424; --line:#323232; --line2:#3d3d3d;
  --tx:#e9e9e7; --dim:#8d8d88; --faint:#6a6a66;
  --mint:#35dfa1; --mint-dim:#1d7a5a; --salmon:#e0645c; --amber:#d9a441; --sky:#4fc3e8;
  --b:"Inter",system-ui,sans-serif; --m:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--b);font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit}
.top{display:flex;align-items:center;gap:30px;background:#101010;border-bottom:1px solid var(--line);
  padding:11px 20px;position:sticky;top:0;z-index:5}
.logo{font-weight:600;font-size:16px;letter-spacing:.13em;color:var(--mint)}
.logo span{color:var(--tx)}
.stat .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--m);font-size:16px;font-weight:500;margin-top:1px}
.stat .v small{font-size:11px;color:var(--dim);margin-left:5px}
.grow{flex:1}
.shell{display:grid;grid-template-columns:222px 1fr;min-height:calc(100vh - 47px)}
aside{border-right:1px solid var(--line);background:#181818;padding:14px 12px 18px;
  display:flex;flex-direction:column;position:sticky;top:47px;align-self:start;
  height:calc(100vh - 47px);overflow-y:auto}
.asidefoot{margin-top:auto;padding-top:18px}
.credit{display:flex;align-items:center;gap:7px;width:100%;background:transparent;color:var(--faint);
  border:1px solid transparent;border-radius:7px;padding:8px 10px;font-size:12px;cursor:pointer;text-align:left}
.footbtn{display:flex;align-items:center;gap:9px;width:100%;background:transparent;color:var(--dim);
  border:1px solid transparent;border-radius:7px;padding:9px 11px;font-size:13.5px;cursor:pointer;
  text-align:left;margin-bottom:4px}
.footbtn:hover{background:var(--panel);color:var(--tx)}
.footbtn.on{background:var(--panel2);color:var(--tx);border-color:var(--line2)}
.setrow{display:flex;align-items:center;gap:20px;justify-content:space-between;
  padding:15px 0;border-bottom:1px solid #262626}
.setrow:last-child{border-bottom:none}
.setname{font-size:14.5px;font-weight:500}
.settext{font-size:12.5px;color:var(--faint);margin-top:2px}
.toggle{width:46px;height:26px;border-radius:99px;border:1px solid var(--line2);background:#141414;
  cursor:pointer;padding:0;position:relative;flex:none}
.toggle span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--dim);transition:left .13s ease,background .13s ease}
.toggle.on{border-color:var(--mint-dim);background:#12291f}
.toggle.on span{left:23px;background:var(--mint)}
.gstep{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid #262626}
.gstep:last-child{border-bottom:none}
.gnum{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);
  color:var(--mint);font-family:var(--m);font-size:13px;display:flex;align-items:center;
  justify-content:center;margin-top:2px}
.gbody{min-width:0;flex:1}
.gtitle{font-size:15px;font-weight:600;margin-bottom:3px}
.gtext{color:var(--dim);max-width:70ch}
.mock{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:14px;
  pointer-events:none;max-width:720px}
.mock table.prodtbl{table-layout:auto}
.mock td.act{white-space:nowrap;text-align:right}
.mock table{font-size:13px}
.mock td{height:52px;padding:0 14px}
.mock td:first-child{min-width:150px}
.mock .btn{cursor:default}
.mockinp{display:inline-block;border:1px solid var(--line2);border-radius:6px;background:#141414;
  padding:7px 9px;font-family:var(--m);text-align:right}
.mock .setrow{border-bottom:none;padding:10px 0}
table.tight td{height:50px}
table.tight.prodtbl td{height:50px}
.credit:hover{color:var(--dim);border-color:var(--line)}
.credit.on{color:var(--tx);border-color:var(--line2);background:var(--panel2)}
.navlbl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:14px 8px 7px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;color:var(--dim);border:1px solid transparent;border-radius:7px;
  padding:9px 11px;font-size:13.5px;cursor:pointer}
.nav button:hover{background:var(--panel);color:var(--tx)}
.nav button.on{background:var(--panel2);color:var(--tx);border-color:var(--line2)}
.nav button.add{color:var(--mint);border:1px dashed var(--line2);margin-top:8px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex:none}
.dot.bad{background:var(--salmon)} .dot.off{background:var(--faint)}
.nav .nmtx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{font-family:var(--m);font-size:11px;color:var(--faint)}
main{padding:22px 26px 70px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:18px}
.panel.focus{border-color:var(--sky)}
.ph{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line)}
.ph .sq{width:9px;height:9px;border-radius:2px;background:var(--sky)}
.ph h2{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;margin:0;color:var(--tx)}
.ph .hint{margin-left:auto;font-size:11.5px;color:var(--faint)}
.pb{padding:14px 15px} .pb.flush{padding:0}
label{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
select,input,textarea{background:#141414;color:var(--tx);border:1px solid var(--line2);border-radius:6px;
  padding:8px 10px;font-family:var(--m);font-size:14px}
select{min-width:200px} select:disabled{color:var(--dim);background:#191919;cursor:not-allowed}
input[type=number]{width:104px;text-align:right}
textarea{width:100%;min-height:74px;resize:vertical;font-size:12px;line-height:1.45;word-break:break-all}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.btn{background:var(--panel2);color:var(--tx);border:1px solid var(--line2);border-radius:6px;
  padding:8px 13px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--dim)}
.btn.mint{color:var(--mint);border-color:var(--mint-dim)} .btn.mint:hover{background:#12291f}
.btn.warn{color:var(--salmon);border-color:#6b2a26} .btn.warn:hover{background:#2a1513}
.btn.lock[data-on="1"]{color:var(--amber);border-color:#6b5220;background:#241d10}
.btn.sm{padding:8px 13px;font-size:12.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line)}
.cell{background:var(--panel);padding:12px 15px}
.cell .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.cell .v{font-family:var(--m);font-size:19px;font-weight:500;margin-top:2px}
.mint{color:var(--mint)} .bad{color:var(--salmon)} .amb{color:var(--amber)} .dim{color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;
  text-align:right;padding:14px 16px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:17px 16px;border-bottom:1px solid #262626;font-family:var(--m);vertical-align:middle}
td:first-child{min-width:210px;white-space:nowrap}
td:first-child .tag{margin-left:8px;vertical-align:2px}
td:first-child{font-family:var(--b)} td:not(:first-child){text-align:right}
tbody tr:last-child td{border-bottom:none}
tr.sum td{background:#1a1a1a;font-weight:500;border-bottom:none;padding-top:19px;padding-bottom:19px}
tr.click{cursor:pointer} tr.click:hover td{background:#262626}
.node{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 13px;margin-bottom:5px}
.node.raw{background:#1b1b1b;border-style:dashed} .node.buy{opacity:.55}
.lane{position:relative}
.lane::before{content:"";position:absolute;left:-13px;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.nm{font-weight:500;font-size:14px}
.meta{font-size:12px;color:var(--dim);margin-top:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.figs{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.fig{text-align:right;min-width:58px}
.fig .k{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.fig .v{font-family:var(--m);font-size:14px}
.pill{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;background:transparent;color:var(--dim);
  border:1px solid var(--line2);border-radius:99px;padding:2px 9px;cursor:pointer}
.pill[data-on="buy"]{color:var(--amber);border-color:#6b5220} .pill:hover{color:var(--tx)}
.tag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.tag.cust{color:var(--mint);border-color:var(--mint-dim)}
.mini{width:100%;max-width:82px;padding:9px 10px;font-size:14.5px}
.lbl{margin-top:6px;font-family:var(--b)}
table.prodtbl{table-layout:fixed}
table.prodtbl td{height:66px;padding-top:0;padding-bottom:0;overflow:hidden}
table.prodtbl th{overflow:hidden}
tr.grp td{background:#212121}
tr.grp td:first-child{font-weight:600}
tr.sub td{background:#1a1a1a}
tr.sub td:first-child{padding-left:32px;font-family:var(--b)}
.ico-btn{padding:8px 9px}
.ico-btn .chev{transition:transform .12s ease}
.ico-btn.down .chev{transform:rotate(90deg)}
.branch{display:inline-block;width:16px;height:1px;background:var(--line2);
  vertical-align:middle;margin-right:11px}
.lblro{color:var(--dim);font-size:13px}
tr.hidrow td{opacity:.42}
.linkbtn{background:none;border:none;color:var(--sky);font:inherit;font-size:11.5px;
  cursor:pointer;padding:0;text-decoration:underline}
.linkbtn:hover{color:var(--mint)}
.lblinp{width:100%;max-width:100%;padding:5px 8px;font-size:12.5px;font-family:var(--b);
  background:transparent;border:1px solid transparent;border-radius:5px;color:var(--dim)}
.lblinp:hover{border-color:var(--line)}
.lblinp:focus{border-color:var(--line2);background:#141414;color:var(--tx)}
.seg{display:inline-flex;gap:2px;background:#141414;border:1px solid var(--line2);border-radius:7px;padding:2px}
.seg button{background:transparent;border:none;color:var(--dim);font-size:11.5px;letter-spacing:.04em;
  padding:5px 12px;border-radius:5px;cursor:pointer;font-family:var(--b)}
.seg button.on{background:var(--panel2);color:var(--mint)}
.seg button:hover{color:var(--tx)}
.ico{width:30px;height:30px;object-fit:contain;vertical-align:-9px;margin-right:11px;flex:none}
.ico.noico{display:inline-block;background:#2c2c2c;border-radius:4px}
td.act{white-space:nowrap}
td.act .btn{margin-right:4px}
.lft{text-align:left!important}
.bar{height:3px;background:#2d2d2d;border-radius:2px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--mint)} .bar i.low{background:var(--salmon)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.note{font-size:12px;color:var(--faint);padding:11px 15px;border-top:1px solid var(--line)}
.empty{padding:52px;text-align:center;color:var(--dim)}
.ing{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ing input[type=text]{flex:1;min-width:120px}
.msg{font-size:12.5px;padding:8px 11px;border-radius:6px;margin-top:10px}
.msg.ok{color:var(--mint);background:#12291f;border:1px solid var(--mint-dim)}
.msg.err{color:var(--salmon);background:#2a1513;border:1px solid #6b2a26}
svg.ic{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line);position:static;height:auto}
  .cols{grid-template-columns:1fr}.figs{justify-content:flex-start}.node{grid-template-columns:1fr}}
</style>

<div class="top">
  <div class="logo">CAPITAL RIFT <span>FACTORY</span></div>
  <div class="stat"><div class="k">Productions</div><div class="v" id="tProd">0</div></div>
  <div class="stat"><div class="k">Shortfalls</div><div class="v" id="tShort">0</div></div>

</div>

        <span>Settings</span></button>
      <button class="credit" data-tab="about" id="aboutBtn">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.4a3.5 3.5 0 100 5.2"/></svg>
        <span id="creditName"></span></button>
    </div>
  </aside>
  <main id="view"></main>
</div>

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm = s => (IT[s]||BASE.i[s]||[s])[0];
const iconOf = s => (S.icons&&S.icons[s]) || (PACKICONS&&PACKICONS[s]) || ICONS[s] || null;
function withIcon(s){
  const u=iconOf(s);
  return (u?`<img class="ico" src="${u}" alt="" loading="lazy">`:'<span class="ico noico"></span>')
    + esc(nm(s));
}
const slugify = t => t.toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const findSlug = t => Object.keys(IT).find(s=>nm(s).toLowerCase()===String(t).toLowerCase().trim());
function fmt(n){
  const a=Math.abs(n);
  const d = a===0?0 : a<0.1?3 : a<10?2 : a<1000?1 : 0;
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
const perH = n => fmt(n*60);
const recipeOf = s => { const i=byOut[s]?.[0]; return i===undefined?null:RC[i]; };

/* ---------- data assembly ---------- */
function packToRaw(pk){
  const i={}, r=[]; PACKICONS={};
  (pk.items||[]).forEach(it=>{ const id=it.id||slugify(it.name);
    i[id]=[it.name||id, +it.price||0, it.category||'', it.soldFrom||''];
    if(it.icon) PACKICONS[id]=it.icon; });
  const idOf = t => { if(!t) return null; if(i[t]) return t;
    const hit=Object.keys(i).find(k=>i[k][0].toLowerCase()===String(t).toLowerCase());
    if(hit) return hit; const s=slugify(t); i[s]=[String(t),0,'','']; return s; };
  (pk.recipes||[]).forEach(rec=>{
    const prod=idOf(rec.product), st=idOf(rec.station);
    if(!prod||!st) return;
    r.push([rec.name||('Craft '+i[prod][0]), st, prod, +rec.batch||1, +rec.perMin||0,
            (rec.inputs||[]).map(x=>[idOf(x.item), +x.qty||0]).filter(([s,q])=>s&&q>0)]);
  });
  return {i,r};
}
function rebuild(){
  let src = BASE; PACKICONS=null;
  if(PACK){
    const conv = packToRaw(PACK);
    src = (PACK.mode==='merge')
      ? { i:Object.assign({},BASE.i,conv.i),
          r:BASE.r.filter(b=>!conv.r.some(c=>c[2]===b[2])).concat(conv.r) }
      : conv;
  }
  IT = Object.assign({}, src.i, S.items||{});
  RC = src.r.slice();
  byOut = {};
  RC.forEach((r,i)=>{ (byOut[r[2]] ||= []).push(i); });
  craftable = Object.keys(byOut).sort((a,b)=>nm(a).localeCompare(nm(b),'en'));
  document.getElementById('itemNames').innerHTML =
    Object.keys(IT).map(s=>`<option value="${esc(nm(s))}">`).join('');
}

/* ---------- persistence ---------- */
async function save(){
  const j=JSON.stringify(S);
  try{ await window.storage.set('crf2', j); return; }catch(e){}
  try{ localStorage.setItem('crf2', j); }catch(e){}
}
async function loadRemotePack(){
  // The data file lives next to this page in the repository, so a patch means
  // replacing one JSON file - no rebuild, nothing for players to install.
  try{
    const res = await fetch('capitalrift-data.json', {cache:'no-cache'});
    if(!res.ok) return false;
    const pk = await res.json();
    if(!Array.isArray(pk.recipes) || !pk.recipes.length) return false;
    PACK = pk; DATASRC = 'file';
    return true;
  }catch(e){ return false; }   // opened from disk, offline, or file missing
}
async function savePack(){
  try{ if(PACK) await window.storage.set('crf-pack', JSON.stringify(PACK));
       else await window.storage.delete('crf-pack'); return; }catch(e){}
  try{ if(PACK) localStorage.setItem('crf-pack', JSON.stringify(PACK));
       else localStorage.removeItem('crf-pack'); }catch(e){}
}
async function loadPack(){
  try{ const a=await window.storage.get('crf-pack'); PACK=JSON.parse(a.value); return; }catch(e){}
  try{ const v=localStorage.getItem('crf-pack'); if(v) PACK=JSON.parse(v); }catch(e){}
}
const encode = () => btoa(unescape(encodeURIComponent(JSON.stringify(S)))).replace(/\+/g,'-').replace(/\//g,'_');
const decode = c => JSON.parse(decodeURIComponent(escape(atob(
  c.trim().replace(/^.*#/,'').replace(/-/g,'+').replace(/_/g,'/')))));
function normalize(o){
  o.items ||= {}; o.recipes = [];
  o.opt = Object.assign({}, DEFOPT, o.opt||{});
  o.hidden = o.hidden && typeof o.hidden==='object' ? o.hidden : {};
  if(!o.prods && Array.isArray(o.lines)){          // aus Version 1 übernehmen
    o.prods = o.lines.map(l=>({item:l.slug, rate:(+l.rate||0)/60,
                               byMachines:false, owned:0, lock:!!l.lock}));
    delete o.lines; delete o.owned; delete o.prices;
  }
  o.prods ||= [];
  o.prods.forEach(p=>{ delete p.kind; p.rate=+p.rate||0; p.label=p.label||'';
    p.owned=+p.owned||0; p.byMachines=!!p.byMachines; p.machines=+p.machines||0; p.lock=!!p.lock; });
  return o;
}
async function load(){
  const h=location.hash.slice(1);
  if(h){ try{ S=normalize(decode(h)); return; }catch(e){} }
  try{ const a=await window.storage.get('crf2'); S=normalize(JSON.parse(a.value)); return; }catch(e){}
  try{ const v=localStorage.getItem('crf2'); if(v){ S=normalize(JSON.parse(v)); return; } }catch(e){}
  try{ const v=localStorage.getItem('crf'); if(v){ S=normalize(JSON.parse(v)); return; } }catch(e){}
  S=normalize({prods:[]});
}

function targetOf(p){
  if(isMade(p) && p.byMachines){
    const r=recipeOf(p.item); return r ? (+p.machines||0)*r[4] : 0;
  }
  return +p.rate||0;
}
function actualOf(p){
  const r=recipeOf(p.item);
  if(!r) return targetOf(p);              // Rohstoffe: was du einträgst, fließt auch
  return (+p.owned||0)*r[4];              // Maschinen bestimmen den echten Ausstoß
}
const rateOf = targetOf;
function ledger(m){
  m = m || mode;
  const supply={}, demand={}, stations={};
  S.prods.forEach(p=>{
    const rate = m==='target' ? targetOf(p) : actualOf(p);
    supply[p.item]=(supply[p.item]||0)+rate;
    const r=recipeOf(p.item); if(!r) return;
    r[5].forEach(([s,q])=>{ demand[s]=(demand[s]||0)+rate*q/r[3]; });
    const st=stations[r[1]] ||= {need:0, calc:0, owned:0};
    const machines=r[4]?targetOf(p)/r[4]:0;     // gebaut wird immer aufs Ziel hin
    st.calc+=machines; st.need+=Math.ceil(machines-1e-9); st.owned+=(+p.owned||0);
  });
  const items=[...new Set([...Object.keys(supply),...Object.keys(demand)])];
  const rows=items.map(s=>({item:s, sup:supply[s]||0, dem:demand[s]||0,
                            bal:(supply[s]||0)-(demand[s]||0)}));
  rows.sort((a,b)=> nm(a.item).localeCompare(nm(b.item), 'en'));
  return {rows, stations, supply, demand};
}
function machinesFor(p){
  const r=recipeOf(p.item); if(!r||!r[4]) return 0;
  return Math.ceil(targetOf(p)/r[4]-1e-9);
}

/* ---------- balance ---------- */
function balanceView(){
  const L=ledger();
  if(!S.prods.length) return panel('var(--sky)','Balance','',
    `<div class="empty">Nothing running yet. Go to <strong>Productions</strong> and enter what your
      factory makes &mdash; ore, bars, finished goods, anything.</div>`);
  const H=opt('showHourly');
  const short=L.rows.filter(r=>r.bal<-1e-9 && !(S.hidden||{})[r.item]);
  const other=ledger(mode==='target'?'built':'target');
  const toggle=`<span class="seg">
    <button data-mode="target" class="${mode==='target'?'on':''}">At target</button>
    <button data-mode="built" class="${mode==='built'?'on':''}">As built</button></span>`;
  const strip=panel('var(--mint)','Factory balance', toggle,
    `<div class="strip">${[
      ['Productions',S.prods.length,''],
      ['Items in play',L.rows.length,''],
      ['Shortfalls',short.length,short.length?'bad':'mint'],
      ...(mode==='built' ? (()=>{
        const tg=other.rows.filter(r=>r.sup>1e-9);
        const hit=tg.length ? tg.reduce((a,r)=>{
          const b=L.rows.find(x=>x.item===r.item);
          return a+Math.min(1,(b?b.sup:0)/r.sup); },0)/tg.length : 1;
        return [['Of target reached', Math.round(hit*100)+'%', hit>=0.999?'mint':(hit>=0.5?'amb':'bad')]];
      })() : [['Short as built', other.rows.filter(r=>r.bal<-1e-9).length,'']]),
    ].map(([k,v,c])=>`<div class="cell"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('')}</div>`,
    mode==='target'
      ? 'What your factory would flow once every machine on the Productions page is built.'
      : 'What your factory flows right now, from the machines you actually own.');
  const T = mode==='built' ? ledger('target') : null;
  const row=r=>{
    const s=r.bal<-1e-9?'bad':(r.bal>1e-9?'mint':'dim');
    const isHid=!!hid[r.item];
    const canMake=!!recipeOf(r.item);
    let pct='';
    if(T){
      const tr=T.rows.find(x=>x.item===r.item);
      const tgt=tr?tr.sup:0;
      if(tgt>1e-9){
        const v=r.sup/tgt;
        const c=v>=0.999?'mint':(v>=0.5?'amb':'bad');
        pct=`<td class="${c}">${Math.round(v*100)}%<div class="bar">
          <i class="${v>=0.999?'':'low'}" style="width:${Math.min(100,v*100)}%"></i></div></td>`;
      } else pct='<td class="dim">&mdash;</td>';
    }
    return `<tr class="${isHid?'hidrow':''}"><td>${withIcon(r.item)}</td>
      <td>${fmt(r.sup)}</td>${H?`<td class="dim">${perH(r.sup)}</td>`:''}
      <td>${fmt(r.dem)}</td>${H?`<td class="dim">${perH(r.dem)}</td>`:''}
      ${pct}
      <td class="${s}">${r.bal>1e-9?'+':''}${fmt(r.bal)}</td>
      ${H?`<td class="${s} dim">${r.bal>1e-9?'+':''}${perH(r.bal)}</td>`:''}
      <td class="lft act">${r.bal<-1e-9?`<button class="btn sm" data-cover="${r.item}">
        ${canMake?'Produce it':'Add resource'}</button>`:''}
        <button class="btn sm ico-btn" data-hide="${r.item}"
          title="${hid[r.item]?'Show this item again':'Hide this row'}">${hid[r.item]?EYE:EYEOFF}</button>
      </td></tr>`;
  };
  const hid=S.hidden||{};
  const nHidden=L.rows.filter(r=>hid[r.item]).length;
  const shown=L.rows.filter(r=>showHidden || !hid[r.item]);
  const hint=(mode==='target'?'at your target rates':'from the machines you own')
    + (nHidden?` &middot; <button class="linkbtn" data-showhidden="1">${nHidden} hidden${showHidden?' (showing)':''}</button>`:'');
  const table=panel('var(--sky)','Every item', hint,
    `<div class="pb flush"><table${opt('compactRows')?' class="tight"':''}><thead><tr>
      <th>Item</th><th>Made / min</th>${H?'<th>Made / h</th>':''}
      <th>Used / min</th>${H?'<th>Used / h</th>':''}
      ${T?'<th>Of target</th>':''}
      <th>Balance / min</th>${H?'<th>Balance / h</th>':''}<th></th></tr></thead>
      <tbody>${shown.map(row).join('')}</tbody></table></div>`,
    'A negative balance means your productions want more of this than you make. Nothing is rationed &mdash; the shortfall is simply shown.');
  return strip+table;
}

function prodsView(){
  const add=panel('var(--mint)','Add a production','anything your factory runs',
    `<div class="pb"><div class="row">
      <div><label>Item</label><input type="text" list="itemNames" style="width:230px"
        value="${esc(addDraft.item)}" data-a="item" placeholder="e.g. Iron Bar"></div>
      <div><label>Target per minute</label><input type="text" inputmode="decimal"
        value="${esc(addDraft.rate)}" data-a="rate" placeholder="e.g. 8"></div>
      <div><label>Name (optional)</label><input type="text" style="width:190px"
        value="${esc(addDraft.label)}" data-a="label" placeholder="e.g. North mine"></div>
      <div><label>&nbsp;</label><button class="btn mint" data-addprod="1">Add production</button></div>
    </div>${msg?`<div class="msg ${msg.k}">${esc(msg.t)}</div>`:''}</div>`,
    'Rate is finished units per minute, the way the game shows it. Items with a recipe run on machines, everything else counts as a raw resource — the app decides that for you.');
  if(!S.prods.length) return add;

  const H=opt('showHourly');
  const groups=[];
  S.prods.forEach((p,i)=>{
    let g=groups.find(x=>x.item===p.item);
    if(!g){ g={item:p.item, list:[]}; groups.push(g); }
    g.list.push({p,i});
  });

  const body=groups.map(g=>{
    const r=recipeOf(g.item), made=!!r;
    const open=isOpen(g.item, g.list.length);
    const tgt=g.list.reduce((a,x)=>a+targetOf(x.p),0);
    const out=g.list.reduce((a,x)=>a+actualOf(x.p),0);
    const need=g.list.reduce((a,x)=>a+machinesFor(x.p),0);
    const own=g.list.reduce((a,x)=>a+(+x.p.owned||0),0);
    const miss=g.list.reduce((a,x)=>a+Math.max(0,machinesFor(x.p)-(+x.p.owned||0)),0);
    const head=`<tr class="grp">
      <td>${withIcon(g.item)}${made?'':' <span class="tag">resource</span>'}
        ${g.list.length>1?`<span class="tag">${g.list.length} sources</span>`:''}</td>
      <td>${fmt(tgt)}</td>${H?`<td class="dim">${perH(tgt)}</td>`:''}
      <td class="lft dim">${made?esc(nm(r[1])):'&mdash;'}</td>
      <td>${made?need:'&mdash;'}</td><td>${made?own:'&mdash;'}</td>
      <td class="${miss?'bad':'mint'}">${made?miss:'&mdash;'}</td>
      <td class="${made&&out<tgt-1e-9?'bad':'mint'}">${fmt(out)}</td>
      ${H?`<td class="dim">${perH(out)}</td>`:''}
      <td class="lft act">
        <button class="btn sm ico-btn ${open?'down':''}" data-open="${g.item}"
          title="${open?'Collapse':'Expand'}">${CHEV}</button>
        <button class="btn sm" data-more="${g.item}">+ Source</button></td></tr>`;
    if(!open) return head;
    const kids=g.list.map(({p,i})=>{
      const need1=machinesFor(p), out1=actualOf(p), tgt1=targetOf(p);
      const miss1=Math.max(0,need1-(+p.owned||0));
      return `<tr class="sub">
        <td><span class="branch"></span>${p.lock
          ? `<span class="lblro">${esc(p.label||nm(p.item))}</span>`
          : `<input class="lblinp" type="text" value="${esc(p.label||'')}" data-pl="${i}"
               placeholder="name this one">`}</td>
        <td>${(made&&p.byMachines)||p.lock ? fmt(tgt1)
          : `<input class="mini" type="text" inputmode="decimal" value="${p.rate}" data-pr="${i}">`}</td>
        ${H?`<td class="dim">${perH(tgt1)}</td>`:''}
        <td class="lft dim">${made?esc(nm(r[1])):'&mdash;'}</td>
        <td>${!made ? '&mdash;' : (p.byMachines && !p.lock
          ? `<input class="mini" type="text" inputmode="decimal" value="${p.machines}" data-pm="${i}">`
          : (p.byMachines ? fmt(p.machines) : need1))}</td>
        <td>${!made ? '&mdash;' : (p.lock ? p.owned
          : `<input class="mini" type="text" inputmode="decimal" value="${p.owned}" data-po="${i}">`)}</td>
        <td class="${miss1?'bad':'mint'}">${made?miss1:'&mdash;'}</td>
        <td class="${made&&out1<tgt1-1e-9?'bad':'mint'}">${fmt(out1)}</td>
        ${H?`<td class="dim">${perH(out1)}</td>`:''}
        <td class="lft act">
          ${made&&!p.lock?`<button class="btn sm ico-btn" data-pby="${i}"
            title="${p.byMachines?'Switch to rate':'Switch to machine count'}">${SWAP}</button>`:''}
          <button class="btn sm ico-btn lock" data-plock="${i}" data-on="${p.lock?1:0}"
            title="${p.lock?'Unlock':'Lock'}">${p.lock?LOCKIC:OPENIC}</button>
          ${p.lock?'':`<button class="btn sm ico-btn warn" data-pdel="${i}" title="Remove">${TRASH}</button>`}</td></tr>`;
    }).join('');
    return head+kids;
  }).join('');

  const list=panel('var(--amber)','Your productions',
    `${groups.length} item${groups.length===1?'':'s'} · ${S.prods.length} source${S.prods.length===1?'':'s'}`,
    `<div class="pb flush"><table class="prodtbl${opt('compactRows')?' tight':''}">
      <colgroup>${(H?[18,9,8,10,8,8,6,8,8,17]:[22,11,12,10,10,8,10,17])
        .map(w=>`<col style="width:${w}%">`).join('')}</colgroup>
      <thead><tr><th>Item</th><th>Target / min</th>${H?'<th>Target / h</th>':''}
      <th>Station</th><th>Machines</th><th>Owned</th><th>Missing</th>
      <th>Output / min</th>${H?'<th>Output / h</th>':''}<th></th>
      </tr></thead><tbody>${body}</tbody></table></div>`,
    'Each item is one line with its totals. Open it to see and edit the single sources behind it — several mines, several workshops. Target sets how many machines you need, Output is what the machines you own actually make.');
  return add+list;
}

/* ---------- import from the game ---------- */
function impSummary(){
  const g={};
  Object.values(imported).forEach(f=>{
    if(!f.machineRecipe) return;
    const k=f.machineRecipe;
    (g[k] ||= {count:0, stations:new Set()});
    g[k].count++; g[k].stations.add(f.itemId);
  });
  return g;
}
function addImport(text){
  let data;
  try{ data=JSON.parse(text); }
  catch(e){ impMsg={k:'err',t:'That is not valid JSON. Copy the whole response, starting with {'}; return; }
  const list = Array.isArray(data) ? data : (data.furniture || data.items || null);
  if(!Array.isArray(list)){ impMsg={k:'err',t:'No "furniture" list found in that response.'}; return; }
  let added=0, dupes=0, machines=0;
  list.forEach(f=>{
    if(!f || !f.id) return;
    if(imported[f.id]) dupes++; else added++;
    imported[f.id]={itemId:f.itemId, machineRecipe:f.machineRecipe||null};
    if(f.machineRecipe) machines++;
  });
  impMsg={k:'ok', t:`${added} new pieces of furniture read`
    + (dupes?`, ${dupes} already known`:'')
    + `. ${machines} of them are machines with a recipe set.`};
}
function applyImport(){
  const g=impSummary();
  let touched=0, unknown=[];
  Object.entries(g).forEach(([item, info])=>{
    if(!recipeOf(item)){ unknown.push(item); return; }
    const ex=S.prods.filter(p=>p.item===item).find(p=>!p.lock);
    if(ex){ ex.byMachines=true; ex.machines=info.count; ex.owned=info.count; }
    else S.prods.push({item, label:'', rate:0, byMachines:true,
                       machines:info.count, owned:info.count, lock:false});
    touched++;
  });
  save();
  const txt=`${touched} production${touched===1?'':'s'} updated from the game.`
    + (unknown.length?` Not in the data file, so skipped: ${unknown.join(', ')}.`:'');
  impMsg={k: unknown.length?'err':'ok', t:txt};
  msg={k: unknown.length?'err':'ok', t:txt};
  tab='prods'; render();
}

  const g=impSummary();
  const keys=Object.keys(g).sort((a,b)=>nm(a).localeCompare(nm(b)));
  const total=Object.keys(imported).length;
  const machines=Object.values(imported).filter(f=>f.machineRecipe).length;

  const ext=extSeen
    ? panel('var(--mint)','Extension connected',
        extBuildings?`${extBuildings} building${extBuildings===1?'':'s'} known`:'no buildings known yet',
        `<div class="pb">
          <p style="margin:0 0 12px">${extBuildings
            ? 'The extension knows where your buildings are. One button re-reads them all &mdash; '
              + 'Capital Rift does not even have to be open, as long as you are still signed in there.'
            : 'Open Capital Rift and click through your buildings once. After that the extension knows '
              + 'their addresses and can re-read them on its own.'}</p>
          <div class="row">
            <button class="btn mint" data-extrefresh="1" ${extBusy?'disabled':''}>
              ${extBusy?'Reading…':'Refresh from the game'}</button>
            ${Object.keys(imported).length?`<button class="btn mint" data-impapply="1">
              Apply to productions</button>`:''}
          </div>
          ${extUpdated?`<p style="margin:12px 0 0;color:var(--faint);font-size:12.5px">
            Last read ${esc(new Date(extUpdated).toLocaleString())}</p>`:''}
          ${impMsg?`<div class="msg ${impMsg.k}">${esc(impMsg.t)}</div>`:''}
        </div>`)
    : panel('var(--sky)','Extension not found','Firefox add-on required',
        `<div class="pb">
          <p style="margin:0 0 12px">Reading your factory needs the companion extension. The game only
            answers your own browser, so a web page on its own cannot ask for your buildings &mdash;
            an extension can.</p>
          <p style="margin:0 0 12px">It is in the <strong>extension</strong> folder of the project.
            Load it in Firefox under <code>about:debugging</code> &rarr; This Firefox &rarr;
            Load Temporary Add-on, then sign in to Capital Rift and press <strong>Read my factory</strong>
            in its toolbar popup.</p>
          <p style="margin:0;color:var(--faint);font-size:12.5px">It only reads your own account, never
            writes to the game, and nothing leaves your browser. Until it is installed you can enter your
            productions by hand on the Productions page.</p>
        </div>`);
  if(!total) return ext;
  const rows=keys.map(k=>{
    const known=!!recipeOf(k);
    const st=[...g[k].stations].map(s=>nm(s)).join(', ');
    return `<tr><td>${known?withIcon(k):esc(k)+' <span class="tag">unknown</span>'}</td>
      <td>${g[k].count}</td><td class="lft dim">${esc(st)}</td>
      <td>${known?fmt(g[k].count*recipeOf(k)[4]):'&mdash;'}</td>
      <td class="dim">${known?perH(g[k].count*recipeOf(k)[4]):'&mdash;'}</td></tr>`;}).join('');
  const found=panel('var(--amber)','What was found',
    `${total} pieces of furniture, ${machines} machines`,
    `<div class="pb flush"><table><thead><tr><th>Recipe</th><th>Machines</th><th>Station</th>
      <th>Output / min</th><th>Output / h</th></tr></thead><tbody>${rows}</tbody></table></div>
     <div class="pb"><button class="btn mint" data-impapply="1">
       Apply to productions</button></div>`,
    'Applying sets each production to "by machines" with the count from the game, and fills Owned to match. '
    + 'Locked productions are left alone.');
  return ext+found;
}

/* ---------- planner ---------- */
function plan(root, rate){
  const spare={};
  ledger('target').rows.forEach(r=>{ if(r.bal>1e-9) spare[r.item]=r.bal; });
  const idx={}, rows=[];
  (function walk(slug, qty, depth, seen){
    let e=idx[slug];
    if(!e){ e=idx[slug]={item:slug, need:0, covered:0, add:0, depth}; rows.push(e); }
    e.depth=Math.max(e.depth, depth);
    e.need+=qty;
    const avail=spare[slug]||0, use=Math.min(qty, avail);
    spare[slug]=avail-use;
    e.covered+=use;
    const rest=qty-use;
    e.add+=rest;
    if(rest<=1e-9 || seen.has(slug)) return;
    const r=recipeOf(slug); if(!r) return;
    r[5].forEach(([s,q])=>walk(s, rest*q/r[3], depth+1, new Set([...seen,slug])));
  })(root, rate, 0, new Set());
  rows.sort((a,b)=> a.depth-b.depth || nm(a.item).localeCompare(nm(b.item)));
  return rows;
}
function addRate(item, rate){
  const ex=S.prods.filter(x=>x.item===item).find(x=>!x.lock);
  if(ex){ ex.byMachines=false; ex.rate=+(targetOf(ex)+rate).toFixed(4); }
  else S.prods.push({item, label:'', rate:+rate.toFixed(4),
                     byMachines:false, machines:0, owned:0, lock:false});
}
function plannerView(){
  const H=opt('showHourly');
  const form=panel('var(--mint)','Plan a production','what it would take on top of what you run',
    `<div class="pb"><div class="row">
      <div><label>Item</label><input type="text" list="itemNames" style="width:250px"
        value="${esc(planDraft.item)}" data-pln="item" placeholder="e.g. Computer"></div>
      <div><label>Target per minute</label><input type="text" inputmode="decimal"
        value="${esc(planDraft.rate)}" data-pln="rate" placeholder="e.g. 0.6"></div>
    </div>${msg?`<div class="msg ${msg.k}">${esc(msg.t)}</div>`:''}</div>`,
    'Every step is checked against the spare capacity your factory already has. Only what is left over shows up as missing.');
  const slug=findSlug(planDraft.item);
  const rate=parseFloat(planDraft.rate);
  if(!slug || !(rate>0)) return form;
  if(!recipeOf(slug)) return form + panel('var(--amber)', nm(slug),'raw resource',
    `<div class="empty">${esc(nm(slug))} has no recipe &mdash; it is a raw resource.
      Add it directly on the Productions page.</div>`);

  const rows=plan(slug, rate);
  const missing=rows.filter(r=>r.add>1e-9);
  const strip=`<div class="strip">${[
      ['Steps', rows.length, ''],
      ['Already covered', rows.filter(r=>r.add<=1e-9).length, 'mint'],
      ['Still missing', missing.length, missing.length?'bad':'mint'],
      ['Machines to build', missing.reduce((a,r)=>{
          const rc=recipeOf(r.item); return a + (rc&&rc[4]?Math.ceil(r.add/rc[4]-1e-9):0); },0), ''],
    ].map(([k,v,c])=>`<div class="cell"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('')}</div>`;
  const body=rows.map(r=>{
    const rc=recipeOf(r.item);
    const mach=rc&&rc[4]?Math.ceil(r.add/rc[4]-1e-9):0;
    const done=r.add<=1e-9;
    return `<tr>
      <td style="padding-left:${16+Math.min(r.depth,6)*18}px">${withIcon(r.item)}
        ${rc?'':'<span class="tag">resource</span>'}</td>
      <td>${fmt(r.need)}</td>${H?`<td class="dim">${perH(r.need)}</td>`:''}
      <td class="${r.covered>1e-9?'mint':'dim'}">${fmt(r.covered)}</td>
      <td class="${done?'mint':'bad'}">${done?'covered':fmt(r.add)}</td>
      <td class="lft dim">${rc?esc(nm(rc[1])):'&mdash;'}</td>
      <td>${rc?(done?'&mdash;':mach):'&mdash;'}</td>
      <td class="lft">${done?'':`<button class="btn sm" data-plan1="${r.item}:${r.add}">+ Add</button>`}</td>
      </tr>`;}).join('');
  const table=panel('var(--sky)', `${nm(slug)} at ${fmt(rate)} / min`,
    missing.length?`${missing.length} step${missing.length===1?'':'s'} missing`:'everything covered',
    strip+`<div class="pb flush"><table><thead><tr><th>Step</th><th>Needed / min</th>
      ${H?'<th>Needed / h</th>':''}<th>From spare</th><th>Still missing</th>
      <th>Station</th><th>Machines</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`
    + (missing.length?`<div class="pb"><button class="btn mint" data-planall="1">
         Add all ${missing.length} missing to Productions</button></div>`:''),
    'From spare uses the surplus your current productions leave over. Adding raises an existing production of that item, or creates one.');
  return form+table;
}

function snapshotFocus(){
  const ae=document.activeElement;
  if(!ae || !ae.dataset || !Object.keys(ae.dataset).length) return null;
  const k=Object.keys(ae.dataset)[0];
  let sel=null; try{ sel=[ae.selectionStart, ae.selectionEnd]; }catch(e){}
  return {attr:'data-'+k.replace(/[A-Z]/g,c=>'-'+c.toLowerCase()), val:ae.dataset[k],
          text:ae.value, sel};
}
function restoreFocus(f){
  if(!f) return;
  const el=document.querySelector(`[${f.attr}="${f.val}"]`);
  if(!el) return;
  el.focus();
  if(el.value!==f.text) el.value=f.text;
  if(f.sel && f.sel[0]!=null){ try{ el.setSelectionRange(f.sel[0], f.sel[1]); }catch(e){} }
}
function render(){
  const f=snapshotFocus();
  rebuild(); sidebar();
  const body = tab==='balance'?balanceView() : tab==='prods'?prodsView()
    : tab==='machines'?machinesView() : tab==='planner'?plannerView()
    : tab==='guide'?guideView() : tab==='import'?importView()
    : tab==='settings'?settingsView() : tab==='about'?aboutView() : recipesView();
  document.getElementById('view').innerHTML = dialogView()+body;
  restoreFocus(f);
}

/* ---------- actions ---------- */
function ensureItem(name){
  const f=findSlug(name); if(f) return f;
  const s=slugify(name); if(!s) return null;
  S.items[s]=[name.trim(),0,'Custom','']; return s;
}
function addProduction(){
  const item=findSlug(addDraft.item)||ensureItem(addDraft.item);
  if(!item){ msg={k:'err',t:'Type an item name first.'}; return render(); }
  const rate=parseFloat(addDraft.rate);
  if(!(rate>0)){ msg={k:'err',t:'Enter a rate per minute above zero.'}; return render(); }
  const r=recipeOf(item);
  const n=S.prods.filter(p=>p.item===item).length;
  const label=addDraft.label.trim() || (n?`${nm(item)} ${n+1}`:'');
  S.prods.push({item, label, rate, byMachines:false, machines:0, owned:0, lock:false});
  addDraft={item:'',rate:'',label:''};
  msg={k:'ok',t: r ? `${nm(item)} added — runs on ${nm(r[1])}.`
                   : `${nm(item)} added as a raw resource.`};
  save(); render();
}
function exportPack(){
  const out={name:PACK?.name||'Capital Rift data', version:PACK?.version||new Date().toISOString().slice(0,10),
    mode:'replace', items:[], recipes:[]};
  Object.keys(IT).sort().forEach(id=>{ const it=IT[id];
    const e={id,name:it[0],price:it[1],category:it[2]||'',soldFrom:it[3]||''};
    const ic=(S.icons&&S.icons[id])||(PACKICONS&&PACKICONS[id]); if(ic) e.icon=ic;
    out.items.push(e); });
  RC.slice().sort((a,b)=>a[2].localeCompare(b[2])).forEach(r=>
    out.recipes.push({name:r[0],station:r[1],product:r[2],batch:r[3],perMin:r[4],
      inputs:r[5].map(([item,qty])=>({item,qty}))}));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download='capitalrift-data.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  msg={k:'ok',t:'Data file downloaded.'}; render();
}

document.addEventListener('click', e=>{
  const q=s=>e.target.closest(s);
  const hd=q('[data-hide]');
  if(hd){ const it=hd.dataset.hide; S.hidden ||= {};
    if(S.hidden[it]) delete S.hidden[it]; else S.hidden[it]=1;
    save(); render(); return; }
  const sh=q('[data-showhidden]');
  if(sh){ showHidden=!showHidden; render(); return; }
  const md=q('[data-mode]');
  if(md){ mode=md.dataset.mode; render(); return; }
  const ot=q('[data-opt]');
  if(ot){ S.opt=Object.assign({},DEFOPT,S.opt||{});
    S.opt[ot.dataset.opt]=!opt(ot.dataset.opt); save(); render(); return; }
  const dm=q('[data-defmode]');
  if(dm){ S.opt=Object.assign({},DEFOPT,S.opt||{});
    S.opt.defaultMode=dm.dataset.defmode; mode=dm.dataset.defmode; save(); render(); return; }
  const rs=q('[data-reset]');
  if(rs){ dlg={type:'reset', scope:rs.dataset.reset}; msg=null; render(); return; }
  const rc=q('[data-resetgo]');
  if(rc){ if(dlg.scope==='prods'){ S.prods=[]; msg={k:'ok',t:'All productions cleared.'}; }
    else { S.prods=[]; S.items={}; S.opt=Object.assign({},DEFOPT); PACK=null; savePack();
           mode=opt('defaultMode'); msg={k:'ok',t:'Everything reset.'}; }
    dlg=null; save(); render(); return; }
  const rf=q('[data-rfilter]');
  if(rf) return;
  const er=q('[data-extrefresh]');
  if(er){ extBusy=true; impMsg={k:'ok',t:'Asking the extension…'};
    postToExt({source:'crfp-page', kind:'refresh'});
    render(); return; }
  const ir=q('[data-impread]');

  const ic2=q('[data-impclear]');

  if(ia2){ applyImport(); return; }
  const p1=q('[data-plan1]');
  if(p1){ const [it,amt]=p1.dataset.plan1.split(':');
    addRate(it, parseFloat(amt)); save();
    msg={k:'ok',t:`${nm(it)} raised by ${fmt(parseFloat(amt))} /min.`}; render(); return; }
  const pa=q('[data-planall]');
  if(pa){ const slug=findSlug(planDraft.item), rate=parseFloat(planDraft.rate);
    let n=0;
    for(let i=0;i<12;i++){
      const miss=plan(slug,rate).filter(r=>r.add>1e-9);
      if(!miss.length) break;
      miss.forEach(r=>{ addRate(r.item, r.add); n++; });
    }
    save(); msg={k:'ok',t:`${n} production${n===1?'':'s'} added or raised — ${nm(slug)} is covered.`};
    render(); return; }
  const t=q('[data-tab]'), dl=q('[data-dlg]'), ca=q('[data-cancel]'), cf=q('[data-confirm]'),
    cp=q('[data-copy]'), im=q('[data-import]'), ap=q('[data-addprod]'), pd=q('[data-pdel]'),
    pl=q('[data-plock]'), pb=q('[data-pby]'), cv=q('[data-cover]'),
    op=q('[data-open]'), mo=q('[data-more]');
  if(t){ tab=t.dataset.tab; dlg=null; msg=null; render(); }
  else if(dl){ dlg={type:dl.dataset.dlg}; msg=null; render(); }
  else if(ca){ dlg=null; msg=null; render(); }
  else if(ap){ addProduction(); }
  else if(op){ const it=op.dataset.open;
    const n=S.prods.filter(x=>x.item===it).length;
    opened[it]=!isOpen(it,n); render(); }
  else if(mo){ const it=mo.dataset.more;
    const n=S.prods.filter(x=>x.item===it).length;
    S.prods.push({item:it, label:`${nm(it)} ${n+1}`, rate:0, byMachines:false,
                  machines:0, owned:0, lock:false});
    opened[it]=true; save(); render(); }
  else if(pd){ const i=+pd.dataset.pdel, p=S.prods[i];
    if(p.lock){ alert('This production is locked. Unlock it first.'); return; }
    if(!opt('confirmDelete')){ S.prods.splice(i,1); save(); render(); return; }
    dlg={type:'confirm', i}; render(); }
  else if(cf){ S.prods.splice(dlg.i,1); dlg=null; save(); render(); }
  else if(pl){ const p=S.prods[+pl.dataset.plock]; p.lock=!p.lock; save(); render(); }
  else if(pb){ const p=S.prods[+pb.dataset.pby];
    if(p.byMachines){ p.rate=rateOf(p); p.byMachines=false; }
    else { const r=recipeOf(p.item); p.machines=r&&r[4]?+(p.rate/r[4]).toFixed(2):0; p.byMachines=true; }
    save(); render(); }
  else if(cv){ const it=cv.dataset.cover, L=ledger();
    const row=L.rows.find(r=>r.item===it); const gap=Math.abs(row.bal);
    const ex=S.prods.filter(x=>x.item===it).find(x=>!x.lock);
    if(ex){ ex.byMachines=false; ex.rate=+(targetOf(ex)+gap).toFixed(4); }
    else S.prods.push({item:it, label:'', rate:+gap.toFixed(4),
                  byMachines:false, machines:0, owned:0, lock:false});
    tab='prods'; msg={k:'ok',t:`Added ${nm(it)} at ${fmt(gap)} /min to close the gap.`};
    save(); render(); }
  else if(cp){ const el=document.getElementById(cp.dataset.copy); el.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(err){}
    if(!ok && navigator.clipboard) navigator.clipboard.writeText(el.value).then(()=>{},()=>{});
    msg={k:'ok',t:'Copied to clipboard.'}; render(); }
  else if(im){ try{ S=normalize(decode(document.getElementById('importCode').value));
      dlg=null; tab='balance'; msg=null; save(); render(); }
    catch(err){ msg={k:'err',t:'That code could not be read.'}; render(); } }

});
document.addEventListener('input', e=>{
  const d=e.target.dataset;
  if(d.pr!==undefined){ const p=S.prods[+d.pr]; if(p.lock) return;
    p.rate=Math.max(0,parseFloat(e.target.value)||0); save(); render(); }
  else if(d.pm!==undefined){ const p=S.prods[+d.pm]; if(p.lock) return;
    p.machines=Math.max(0,parseFloat(e.target.value)||0); save(); render(); }
  else if(d.po!==undefined){ const p=S.prods[+d.po]; if(p.lock) return;
    p.owned=Math.max(0,parseInt(e.target.value)||0); save(); render(); }
  else if(d.pl!==undefined){ const p=S.prods[+d.pl]; if(p.lock) return;
    p.label=e.target.value; save(); render(); }
  else if(d.rfilter!==undefined){ recipeFilter=e.target.value; render(); }
  else if(d.pln!==undefined){ planDraft[d.pln]=e.target.value; render(); }
  else if(d.a!==undefined){ addDraft[d.a]=e.target.value; }
});
let extSeen=false;
/* Firefox rejects "null" as a target origin, which is what location.origin is
   when the file is opened straight from disk. The message never leaves this
   window, so "*" is the honest choice and works in both cases. */
function postToExt(msg){
  try{ window.postMessage(msg, '*'); }catch(e){}
}
window.addEventListener('message', ev=>{
  if(ev.source!==window) return;
  const d=ev.data;
  if(!d || d.source!=='crfp-extension' || d.kind!=='furniture') return;
  extSeen=true;
  extBuildings=d.buildings||0;
  extUpdated=d.updated||null;
  extBusy=false;
  if(d.refresh){
    impMsg={k: d.refresh.ok?'ok':'err', t:d.refresh.message||''};
    imported={};
    (d.furniture||[]).forEach(f=>{ if(f&&f.id) imported[f.id]={itemId:f.itemId,
      machineRecipe:f.machineRecipe||null}; });
    render(); return;
  }
  let added=0, machines=0;
  (d.furniture||[]).forEach(f=>{
    if(!f || !f.id) return;
    if(!imported[f.id]) added++;
    imported[f.id]={itemId:f.itemId, machineRecipe:f.machineRecipe||null};
    if(f.machineRecipe) machines++;
  });
  if(machines){
    impMsg={k:'ok', t:`Extension connected - ${machines} machines known`
      + (added?`, ${added} new`:'') + '.'};
  }
  render();
});
postToExt({source:'crfp-page', kind:'request'});

(async function init(){ await loadRemotePack(); await load(); mode=opt('defaultMode'); rebuild();
  if(!S.prods.length) tab='guide';
  render(); })();
</script>
